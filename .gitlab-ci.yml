stages:
  - build
  - deploy

# https://gitlab.com/aeontronix/oss/aeon-gitlab-pipeline-components
#
# Branches are only built (npm ci, ng build lib + app, ng test lib + app). On the default branch the
# manual "npm-release" job tags the commit with the version of projects/lib/package.json, and the
# pipeline of that tag publishes dist/lib to the npm registry of this project.
include:
  - component: $CI_SERVER_FQDN/aeontronix/oss/aeon-gitlab-pipeline-components/npm-publish@1.0-beta1
    inputs:
      # the workspace is installed, built and tested as a whole, from projects/lib so that the
      # released version is the one of the library
      build_modules: [projects/lib]
      release_module: projects/lib
      install_command: (cd ../.. && npm ci)
      build_command: (cd ../.. && npm run build)
      test_command: (cd ../.. && npm test)
      # the published package is the one generated by ng-packagr
      publish_modules: [dist/lib]
      artifact_paths: [dist/lib]
