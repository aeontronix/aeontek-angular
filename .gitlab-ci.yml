stages:
  - build
  - deploy

# https://gitlab.com/aeontronix/oss/aeon-gitlab-pipeline-components
#
# Only the library (projects/lib) is built, tested and published; the demo application of
# projects/app is not part of the pipeline. On the default branch the manual "npm-release" job tags
# the commit with the version of projects/lib/package.json, and the pipeline of that tag publishes
# dist/lib to the npm registry of this project.
include:
  - component: $CI_SERVER_FQDN/aeontronix/oss/aeon-gitlab-pipeline-components/npm-publish@1.0-beta1
    inputs:
      # the library module: its package.json version is the released one
      build_modules: [projects/lib]
      release_module: projects/lib
      # the angular cli is a workspace wide tool, so the commands are run from the workspace root
      # in a subshell (the module directory must stay the working directory)
      install_command: (cd ../.. && npm ci)
      build_command: (cd ../.. && npm run build:lib)
      test_command: (cd ../.. && npm run test:lib)
      # what is published is the package generated by ng-packagr, not the source module
      publish_modules: [dist/lib]
      artifact_paths: [dist/lib]
